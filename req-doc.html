<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Requirement Viewer</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Inter',system-ui,sans-serif;background:#0f0f1a;color:#fff;height:100vh;display:flex;flex-direction:column;overflow:hidden;}

/* Toolbar */
.toolbar{display:flex;align-items:center;gap:10px;padding:9px 16px;background:#1a1a2e;border-bottom:1px solid #2a2a3e;flex-shrink:0;}
.t-logo{font-size:12px;font-weight:700;color:#6c63ff;flex-shrink:0;}
.t-sep{width:1px;height:16px;background:#2a2a3e;flex-shrink:0;}
.t-req{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;color:#4f8ef7;background:rgba(79,142,247,.12);border:1px solid rgba(79,142,247,.3);padding:3px 10px;border-radius:20px;flex-shrink:0;}
.t-status{font-size:11px;padding:3px 10px;border-radius:8px;flex-shrink:0;transition:all .3s;}
.t-status.loading{color:#f59e0b;background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.25);}
.t-status.success{color:#10b981;background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.25);}
.t-status.info{color:#6c63ff;background:rgba(108,99,255,.1);border:1px solid rgba(108,99,255,.2);}
.t-spacer{flex:1;}
.t-open{background:#2a2a3e;border:1px solid #3a3a5e;color:#9098b1;padding:5px 12px;border-radius:8px;font-size:11px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:5px;transition:all .15s;flex-shrink:0;}
.t-open:hover{background:#3a3a5e;color:#fff;}
.t-back{background:#6c63ff;border:none;color:#fff;padding:5px 14px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:5px;transition:all .15s;flex-shrink:0;}
.t-back:hover{background:#5a52e0;}

/* iframe */
.doc-wrap{flex:1;position:relative;}
iframe{width:100%;height:100%;border:none;display:block;}

/* Loading overlay */
.loading-overlay{position:absolute;inset:0;background:#0f0f1a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:10;transition:opacity .5s;}
.loading-overlay.hidden{opacity:0;pointer-events:none;}
.spinner{width:40px;height:40px;border:3px solid #2a2a3e;border-top-color:#6c63ff;border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-req{font-size:26px;font-weight:700;color:#6c63ff;font-family:'JetBrains Mono',monospace;}
.loading-text{font-size:13px;color:#6c7389;}
.error-box{background:#2a1a1a;border:1px solid #5a2a2a;border-radius:12px;padding:24px 32px;text-align:center;max-width:420px;}
.error-box h3{color:#ff6b6b;margin-bottom:8px;}
.error-box p{color:#9098b1;font-size:13px;line-height:1.7;}
</style>
</head>
<body>

<div class="toolbar">
  <span class="t-logo">📋 ERP Dev Tracker</span>
  <div class="t-sep"></div>
  <span class="t-req" id="tReq">REQ-??</span>
  <span class="t-status loading" id="tStatus">⏳ Opening document…</span>
  <div class="t-spacer"></div>
  <a class="t-open" id="tOpen" href="#" target="_blank">↗ Open in Drive</a>
  <a class="t-back" href="javascript:history.back()">← Back</a>
</div>

<div class="doc-wrap">
  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-req" id="loadingReq">REQ-??</div>
    <div class="spinner"></div>
    <div class="loading-text" id="loadingText">Opening document and navigating to requirement…</div>
  </div>
  <iframe id="docFrame" src="about:blank" allowfullscreen
    sandbox="allow-scripts allow-same-origin allow-popups allow-forms allow-top-navigation"></iframe>
</div>

<script>
const params   = new URLSearchParams(location.search);
const reqNum   = params.get('req')  || '';
const fileId   = params.get('fid')  || '';
const fileType = params.get('type') || 'doc'; // 'doc' or 'docx'
const reqLabel = 'REQ-' + reqNum;

// Update UI
document.title = reqLabel + ' — Requirement Viewer';
document.getElementById('tReq').textContent        = reqLabel;
document.getElementById('loadingReq').textContent  = reqLabel;

if(!reqNum || !fileId){
  document.getElementById('loadingOverlay').innerHTML =
    '<div class="error-box"><h3>Missing Parameters</h3>' +
    '<p>Please open this page from the ERP dashboard by clicking<br>"📄 View Requirement" on a request card.</p></div>';
} else {
  loadDoc();
}

function loadDoc(){
  // Build Google Docs URL with heading anchor for auto-jump
  // The heading in the doc is "REQ-27 | Title" styled as Heading 1
  // Google Docs supports ?usp=sharing to open in view mode
  const baseUrl = 'https://docs.google.com/document/d/' + fileId;

  // Embedded view URL — opens doc inside iframe in view mode
  // #heading= anchor jumps to the REQ heading automatically
  const embedUrl = baseUrl + '/preview';

  // Full view URL for "Open in Drive" button
  const viewUrl  = baseUrl + '/view';

  document.getElementById('tOpen').href = viewUrl;

  const frame = document.getElementById('docFrame');

  // Hide loading overlay once iframe loads
  frame.addEventListener('load', function(){
    setTimeout(()=>{
      document.getElementById('loadingOverlay').classList.add('hidden');
      document.getElementById('tStatus').className = 't-status success';
      document.getElementById('tStatus').textContent = '✅ Opened at ' + reqLabel;
    }, 800);
  });

  // Set iframe src — Google Docs /preview supports heading anchors
  frame.src = embedUrl + '#heading=' + encodeURIComponent(reqLabel);

  // Fallback: if iframe doesn't load in 10s show message
  setTimeout(()=>{
    const overlay = document.getElementById('loadingOverlay');
    if(!overlay.classList.contains('hidden')){
      document.getElementById('loadingText').textContent =
        'Taking longer than expected — the document may be large.';
    }
  }, 10000);
}
</script>
</body>
</html>
