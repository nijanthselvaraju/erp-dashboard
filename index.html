<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ERP Development Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── THEME TOKENS ── */
    :root {
      --bg:       #0f1117; --surface:  #1a1d27; --surface2: #222537;
      --border:   #2e3146; --text:     #e8eaf0;  --muted:    #7c82a0;
      --accent:   #6c63ff; --accent2:  #a78bfa;
      --shadow:   0 4px 24px rgba(0,0,0,.4);

      --open:        #f59e0b; --open-bg:        rgba(245,158,11,.13);
      --onhold:      #a78bfa; --onhold-bg:      rgba(167,139,250,.13);
      --closed:      #22c55e; --closed-bg:      rgba(34,197,94,.13);
      --cancelled:   #6b7280; --cancelled-bg:   rgba(107,114,128,.13);
      --low:         #3b82f6; --low-bg:         rgba(59,130,246,.13);
      --medium:      #f59e0b; --medium-bg:      rgba(245,158,11,.13);
      --high:        #ef4444; --high-bg:        rgba(239,68,68,.13);
      --critical:    #ff0055; --critical-bg:    rgba(255,0,85,.13);
      --notstarted:  #6b7280; --notstarted-bg:  rgba(107,114,128,.13);
      --inprogress:  #10b981; --inprogress-bg:  rgba(16,185,129,.13);
      --incomplete:  #f59e0b; --incomplete-bg:  rgba(245,158,11,.13);
      --completed:   #22c55e; --completed-bg:   rgba(34,197,94,.13);
      --deferred:    #a78bfa; --deferred-bg:    rgba(167,139,250,.13);
      --devstage:    #6b7280; --devstage-bg:    rgba(107,114,128,.13);
      --testing:     #3b82f6; --testing-bg:     rgba(59,130,246,.13);
      --readydeploy: #10b981; --readydeploy-bg: rgba(16,185,129,.13);
      --deployed:    #22c55e; --deployed-bg:    rgba(34,197,94,.13);
      --stale:       #f59e0b; --stale-bg:       rgba(245,158,11,.08);
    }

    [data-theme="light"] {
      --bg:       #f4f5f9; --surface:  #ffffff; --surface2: #f0f1f7;
      --border:   #dde0ef; --text:     #1a1d27;  --muted:    #6b7280;
      --shadow:   0 4px 24px rgba(0,0,0,.08);
      --open-bg:        rgba(245,158,11,.1);
      --onhold-bg:      rgba(167,139,250,.1);
      --closed-bg:      rgba(34,197,94,.1);
      --cancelled-bg:   rgba(107,114,128,.1);
      --low-bg:         rgba(59,130,246,.1);
      --medium-bg:      rgba(245,158,11,.1);
      --high-bg:        rgba(239,68,68,.1);
      --critical-bg:    rgba(255,0,85,.1);
      --notstarted-bg:  rgba(107,114,128,.1);
      --inprogress-bg:  rgba(16,185,129,.1);
      --incomplete-bg:  rgba(245,158,11,.1);
      --completed-bg:   rgba(34,197,94,.1);
      --deferred-bg:    rgba(167,139,250,.1);
      --devstage-bg:    rgba(107,114,128,.1);
      --testing-bg:     rgba(59,130,246,.1);
      --readydeploy-bg: rgba(16,185,129,.1);
      --deployed-bg:    rgba(34,197,94,.1);
      --stale-bg:       rgba(245,158,11,.07);
    }

    body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; transition: background .25s, color .25s; }

    /* ── HEADER ── */
    header {
      background:var(--surface); border-bottom:1px solid var(--border);
      padding:0 32px; height:64px;
      display:flex; align-items:center; justify-content:space-between;
      position:sticky; top:0; z-index:200; box-shadow:var(--shadow);
    }
    .logo { display:flex; align-items:center; gap:12px; }
    .logo-icon {
      width:36px; height:36px;
      background:linear-gradient(135deg,var(--accent),var(--accent2));
      border-radius:10px; display:flex; align-items:center; justify-content:center;
      font-family:'JetBrains Mono',monospace; font-weight:600; font-size:14px; color:#fff;
    }
    .logo-text { font-weight:700; font-size:16px; letter-spacing:-.3px; }
    .logo-sub  { font-size:11px; color:var(--muted); margin-top:1px; }
    .header-right { display:flex; align-items:center; gap:10px; }
    .last-updated { font-size:12px; color:var(--muted); font-family:'JetBrains Mono',monospace; }

    .theme-toggle {
      width:36px; height:36px; border-radius:9px;
      background:var(--surface2); border:1px solid var(--border);
      color:var(--muted); cursor:pointer; display:flex; align-items:center; justify-content:center;
      font-size:16px; transition:all .15s;
    }
    .theme-toggle:hover { color:var(--text); border-color:var(--accent); }

    .view-sheet-btn {
      display:flex; align-items:center; gap:8px;
      background:var(--accent); color:#fff; text-decoration:none;
      padding:8px 18px; border-radius:8px; font-size:13px; font-weight:600; transition:opacity .2s;
    }
    .view-sheet-btn:hover { opacity:.85; }
    .view-sheet-btn svg { width:14px; height:14px; }

    /* ── MONTH BAR ── */
    #monthBar {
      background:var(--surface); border-bottom:1px solid var(--border);
      padding:10px 32px; display:flex; align-items:center; gap:8px;
      flex-wrap:wrap; position:sticky; top:64px; z-index:100;
    }
    .bar-label { font-size:11px; text-transform:uppercase; letter-spacing:.8px; color:var(--muted); font-weight:600; margin-right:4px; white-space:nowrap; }
    .pill-btn {
      background:var(--surface2); border:1px solid var(--border);
      color:var(--muted); padding:5px 14px; border-radius:20px;
      font-size:12px; font-weight:500; cursor:pointer; transition:all .15s; font-family:'Inter',sans-serif;
    }
    .pill-btn:hover,.pill-btn.active { border-color:var(--accent); color:var(--accent2); background:rgba(108,99,255,.1); }

    /* ── MAIN ── */
    main { max-width:1440px; margin:0 auto; padding:28px 32px 64px; }

    /* ── LOADING ── */
    #loadingState {
      display:flex; flex-direction:column; align-items:center;
      justify-content:center; gap:14px; padding:100px 24px; color:var(--muted); font-size:14px;
    }
    .spinner {
      width:36px; height:36px; border:3px solid var(--border);
      border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite;
    }
    @keyframes spin { to { transform:rotate(360deg); } }
    #dashboardContent { display:none; }

    /* ── STAT BAR ── */
    .stat-bar {
      display:grid; grid-template-columns:repeat(6,1fr);
      gap:14px; margin-bottom:24px;
    }
    .stat-card {
      background:var(--surface); border:1px solid var(--border);
      border-radius:12px; padding:16px 18px; position:relative; overflow:hidden;
      transition: box-shadow .15s;
    }
    .stat-card:hover { box-shadow: 0 0 0 1px var(--accent); }
    .stat-card::before {
      content:''; position:absolute; top:0; left:0; right:0; height:3px; border-radius:12px 12px 0 0;
    }
    .stat-card.sc-total::before    { background:linear-gradient(90deg,var(--accent),var(--accent2)); }
    .stat-card.sc-open::before     { background:var(--open); }
    .stat-card.sc-highcrit::before { background:linear-gradient(90deg,var(--high),var(--critical)); }
    .stat-card.sc-notstart::before { background:var(--notstarted); }
    .stat-card.sc-dev::before      { background:var(--devstage); }
    .stat-card.sc-ready::before    { background:var(--readydeploy); }
    .stat-label { font-size:10px; text-transform:uppercase; letter-spacing:.8px; color:var(--muted); font-weight:600; margin-bottom:8px; }
    .stat-value { font-size:32px; font-weight:700; font-family:'JetBrains Mono',monospace; line-height:1; }
    .stat-card.sc-total .stat-value    { color:var(--accent2); }
    .stat-card.sc-open .stat-value     { color:var(--open); }
    .stat-card.sc-highcrit .stat-value { color:var(--high); }
    .stat-card.sc-notstart .stat-value { color:var(--notstarted); }
    .stat-card.sc-dev .stat-value      { color:var(--devstage); }
    .stat-card.sc-ready .stat-value    { color:var(--readydeploy); }
    .stat-desc { font-size:11px; color:var(--muted); margin-top:5px; }

    /* ── MATRIX GRID ── */
    .matrix-grid {
      display:grid; grid-template-columns:1fr 1fr;
      gap:18px; margin-bottom:24px;
    }
    .matrix-card { background:var(--surface); border:1px solid var(--border); border-radius:14px; overflow:hidden; }
    .matrix-card-header {
      padding:13px 18px 11px; border-bottom:1px solid var(--border);
      display:flex; align-items:center;
    }
    .matrix-card-title { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.8px; color:var(--muted); }
    .matrix-card-total {
      margin-left:auto; font-family:'JetBrains Mono',monospace;
      font-size:11px; color:var(--accent2);
      background:rgba(108,99,255,.12); padding:2px 8px; border-radius:4px;
    }
    .matrix-table-wrap { overflow-x:auto; }
    .matrix-table { width:100%; border-collapse:collapse; font-size:12px; }
    .matrix-table thead th {
      padding:8px 12px; text-align:center;
      font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:.5px; color:var(--muted);
      background:var(--surface2); border-bottom:1px solid var(--border); white-space:nowrap;
    }
    .matrix-table thead th:first-child { text-align:left; }
    .matrix-table tbody tr { border-bottom:1px solid var(--border); transition:background .1s; }
    .matrix-table tbody tr:last-child { border-bottom:none; }
    .matrix-table tbody tr.total-row { background:var(--surface2); border-top:1px solid var(--border); font-weight:700; }
    .matrix-table td { padding:8px 12px; text-align:center; vertical-align:middle; }
    .matrix-table td:first-child { text-align:left; font-weight:600; color:var(--text); white-space:nowrap; font-size:12px; }
    .matrix-table tbody tr:not(.total-row):hover { background:rgba(108,99,255,.04); }
    .matrix-table td.dc { cursor:pointer; }
    .matrix-table td.dc:hover .cp:not(.zero) { transform:scale(1.1); }

    /* count pill */
    .cp {
      display:inline-flex; align-items:center; justify-content:center;
      min-width:26px; padding:3px 7px; border-radius:10px;
      font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:600;
      transition:transform .1s;
    }
    .cp.zero { color:var(--border); background:transparent; font-family:'Inter',sans-serif; font-size:12px; }
    .cp-total      { background:rgba(108,99,255,.12); color:var(--accent2); }
    .cp-open       { background:var(--open-bg);        color:var(--open); }
    .cp-onhold     { background:var(--onhold-bg);      color:var(--onhold); }
    .cp-closed     { background:var(--closed-bg);      color:var(--closed); }
    .cp-cancelled  { background:var(--cancelled-bg);   color:var(--cancelled); }
    .cp-low        { background:var(--low-bg);          color:var(--low); }
    .cp-medium     { background:var(--medium-bg);       color:var(--medium); }
    .cp-high       { background:var(--high-bg);         color:var(--high); }
    .cp-critical   { background:var(--critical-bg);     color:var(--critical); }
    .cp-notstarted { background:var(--notstarted-bg);   color:var(--notstarted); }
    .cp-inprogress { background:var(--inprogress-bg);   color:var(--inprogress); }
    .cp-incomplete { background:var(--incomplete-bg);   color:var(--incomplete); }
    .cp-completed  { background:var(--completed-bg);    color:var(--completed); }
    .cp-deferred   { background:var(--deferred-bg);     color:var(--deferred); }
    .cp-devstage   { background:var(--devstage-bg);     color:var(--devstage); }
    .cp-testing    { background:var(--testing-bg);      color:var(--testing); }
    .cp-rdeploy    { background:var(--readydeploy-bg);  color:var(--readydeploy); }
    .cp-deployed   { background:var(--deployed-bg);     color:var(--deployed); }

    /* ── ACTIVE FILTER CHIPS ── */
    #activeFilters { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
    #activeFilters:empty { display:none; }
    .filter-chip {
      display:inline-flex; align-items:center; gap:6px;
      background:rgba(108,99,255,.15); border:1px solid rgba(108,99,255,.35);
      color:var(--accent2); padding:4px 10px 4px 12px; border-radius:20px; font-size:11px; font-weight:600;
    }
    .filter-chip button { background:none; border:none; color:var(--accent2); cursor:pointer; font-size:14px; line-height:1; padding:0; display:flex; align-items:center; }
    .filter-chip button:hover { color:var(--text); }
    .clear-all-btn {
      background:none; border:1px solid var(--border); color:var(--muted);
      padding:4px 12px; border-radius:20px; font-size:11px; cursor:pointer; font-family:'Inter',sans-serif; transition:all .15s;
    }
    .clear-all-btn:hover { border-color:var(--accent); color:var(--accent2); }

    /* ── TABLE SECTION HEADER ── */
    .section-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; flex-wrap:wrap; gap:10px; }
    .section-title  { font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.8px; color:var(--muted); }
    .section-controls { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }

    /* stale week selector */
    .stale-selector { display:flex; align-items:center; gap:6px; }
    .stale-label { font-size:11px; color:var(--muted); font-weight:500; white-space:nowrap; }
    .week-btn {
      background:var(--surface2); border:1px solid var(--border);
      color:var(--muted); padding:4px 10px; border-radius:16px;
      font-size:11px; font-weight:600; cursor:pointer; transition:all .15s; font-family:'Inter',sans-serif;
    }
    .week-btn:hover { border-color:var(--stale); color:var(--stale); }
    .week-btn.active { border-color:var(--stale); color:var(--stale); background:var(--stale-bg); }

    /* priority filter pills */
    .filters { display:flex; gap:6px; flex-wrap:wrap; }
    .filter-btn {
      background:var(--surface2); border:1px solid var(--border);
      color:var(--muted); padding:5px 14px; border-radius:20px;
      font-size:12px; font-weight:500; cursor:pointer; transition:all .15s; font-family:'Inter',sans-serif;
    }
    .filter-btn:hover,.filter-btn.active { border-color:var(--accent); color:var(--accent2); background:rgba(108,99,255,.1); }

    /* ── TABLE ── */
    .table-wrap { background:var(--surface); border:1px solid var(--border); border-radius:14px; overflow:hidden; }
    .table-top  { padding:13px 18px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:12px; }
    .search-input {
      flex:1; background:var(--bg); border:1px solid var(--border); border-radius:8px;
      padding:8px 14px; color:var(--text); font-size:13px; font-family:'Inter',sans-serif; outline:none; transition:border-color .15s;
    }
    .search-input:focus { border-color:var(--accent); }
    .search-input::placeholder { color:var(--muted); }
    .result-count { font-size:12px; color:var(--muted); font-family:'JetBrains Mono',monospace; white-space:nowrap; }

    table { width:100%; border-collapse:collapse; font-size:13px; }
    thead th {
      padding:10px 16px; text-align:left; font-size:11px; font-weight:600;
      text-transform:uppercase; letter-spacing:.6px; color:var(--muted);
      border-bottom:1px solid var(--border); background:var(--surface2);
      cursor:pointer; user-select:none; white-space:nowrap;
    }
    thead th:hover { color:var(--text); }
    tbody tr { border-bottom:1px solid var(--border); transition:background .1s; cursor:pointer; }
    tbody tr:last-child { border-bottom:none; }
    tbody tr:hover { background:var(--surface2); }
    tbody tr.stale-row { background:var(--stale-bg); }
    tbody tr.stale-row:hover { background:rgba(245,158,11,.13); }
    td { padding:10px 16px; vertical-align:middle; }

    .ref-badge {
      font-family:'JetBrains Mono',monospace; font-size:11px;
      color:var(--accent2); background:rgba(108,99,255,.12);
      padding:3px 8px; border-radius:5px; white-space:nowrap;
    }
    .title-cell { font-weight:500; max-width:260px; }
    .module-tag {
      display:inline-block; font-size:10px; background:var(--surface2);
      color:var(--muted); padding:2px 7px; border-radius:4px; margin-bottom:3px; font-weight:500;
    }
    .title-text { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:240px; display:block; }
    .stale-tag {
      display:inline-flex; align-items:center; gap:3px;
      font-size:10px; font-weight:600; color:var(--stale);
      background:var(--stale-bg); border:1px solid rgba(245,158,11,.25);
      padding:1px 6px; border-radius:4px; margin-left:6px; white-space:nowrap;
    }

    .badge {
      display:inline-flex; align-items:center; padding:3px 10px;
      border-radius:20px; font-size:11px; font-weight:600; white-space:nowrap;
    }
    .badge.status-open      { background:var(--open-bg);       color:var(--open); }
    .badge.status-onhold    { background:var(--onhold-bg);     color:var(--onhold); }
    .badge.status-closed    { background:var(--closed-bg);     color:var(--closed); }
    .badge.status-cancelled { background:var(--cancelled-bg);  color:var(--cancelled); }
    .badge.priority-low     { background:var(--low-bg);         color:var(--low); }
    .badge.priority-medium  { background:var(--medium-bg);      color:var(--medium); }
    .badge.priority-high    { background:var(--high-bg);        color:var(--high); }
    .badge.priority-critical{ background:var(--critical-bg);    color:var(--critical); }
    .badge.dev-notstarted   { background:var(--notstarted-bg);  color:var(--notstarted); }
    .badge.dev-inprogress   { background:var(--inprogress-bg);  color:var(--inprogress); }
    .badge.dev-incomplete   { background:var(--incomplete-bg);  color:var(--incomplete); }
    .badge.dev-completed    { background:var(--completed-bg);   color:var(--completed); }
    .badge.dev-deferred     { background:var(--deferred-bg);    color:var(--deferred); }

    .date-cell { font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--muted); white-space:nowrap; }
    .assignee  { font-size:12px; color:var(--muted); white-space:nowrap; }

    /* ── EMPTY STATE ── */
    .empty-state { text-align:center; padding:48px 24px; color:var(--muted); }
    .empty-state svg { margin-bottom:12px; opacity:.4; }

    /* ── MODAL ── */
    .modal-overlay {
      display:none; position:fixed; inset:0; background:rgba(0,0,0,.65);
      z-index:300; align-items:center; justify-content:center; padding:24px;
    }
    .modal-overlay.open { display:flex; }
    .modal {
      background:var(--surface); border:1px solid var(--border); border-radius:16px;
      max-width:640px; width:100%; max-height:82vh; overflow-y:auto; padding:28px 32px;
      box-shadow:var(--shadow);
    }
    .modal-header { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:18px; }
    .modal-ref    { font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--accent2); margin-bottom:6px; }
    .modal-title  { font-size:18px; font-weight:700; }
    .modal-close  {
      background:var(--surface2); border:1px solid var(--border); color:var(--muted);
      width:32px; height:32px; border-radius:8px; font-size:18px; cursor:pointer;
      display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-left:16px;
    }
    .modal-close:hover { color:var(--text); }
    .modal-meta   { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px; }
    .modal-desc   {
      background:var(--bg); border:1px solid var(--border); border-radius:10px;
      padding:16px; font-size:13px; line-height:1.7; color:var(--muted); margin-bottom:18px;
    }
    .modal-fields { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .field-item   { display:flex; flex-direction:column; gap:3px; }
    .field-label  { font-size:10px; text-transform:uppercase; letter-spacing:.7px; color:var(--muted); }
    .field-value  { font-size:13px; font-weight:500; }

    footer { text-align:center; padding:24px; font-size:12px; color:var(--muted); border-top:1px solid var(--border); }

    /* ── RESPONSIVE ── */
    @media (max-width:1100px) { .stat-bar { grid-template-columns:repeat(3,1fr); } }
    @media (max-width:900px)  { .matrix-grid { grid-template-columns:1fr; } }
    @media (max-width:768px)  {
      header { padding:0 16px; } #monthBar { padding:10px 16px; } main { padding:16px 16px 48px; }
      .stat-bar { grid-template-columns:repeat(2,1fr); } .modal-fields { grid-template-columns:1fr; }
      .logo-sub { display:none; }
      td:nth-child(6),th:nth-child(6),td:nth-child(7),th:nth-child(7) { display:none; }
    }
  </style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="logo">
    <div class="logo-icon">ERP</div>
    <div>
      <div class="logo-text">Dev Tracker</div>
      <div class="logo-sub">VBEDU · Development Dashboard</div>
    </div>
  </div>
  <div class="header-right">
    <span class="last-updated" id="lastUpdated"></span>
    <button class="theme-toggle" id="themeToggle" title="Toggle theme" onclick="toggleTheme()">🌙</button>
    <a class="view-sheet-btn" href="https://docs.google.com/spreadsheets/d/1pRpFxQRcjX0cPCh6SyRzEUj5NLW8BIXv7Cly9n_X_70/edit?usp=sharing" target="_blank">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
      View Sheet
    </a>
  </div>
</header>

<!-- MONTH BAR -->
<div id="monthBar">
  <span class="bar-label">Month</span>
  <div id="monthBtns" style="display:flex;gap:8px;flex-wrap:wrap;"></div>
</div>

<main>
  <div id="loadingState">
    <div class="spinner"></div>
    <span>Loading data from Google Sheets…</span>
  </div>

  <div id="dashboardContent">

    <!-- STAT BAR -->
    <div class="stat-bar" id="statBar"></div>

    <!-- 3×2 MATRIX GRID -->
    <div class="matrix-grid">
      <div class="matrix-card" id="mxStatus"></div>
      <div class="matrix-card" id="mxPriority"></div>
      <div class="matrix-card" id="mxStage"></div>
      <div class="matrix-card" id="mxDevStatus"></div>
      <div class="matrix-card" id="mxDeveloper"></div>
      <div class="matrix-card" id="mxMonth"></div>
    </div>

    <!-- ACTIVE FILTER CHIPS -->
    <div id="activeFilters"></div>

    <!-- TABLE SECTION -->
    <div class="section-header">
      <div class="section-title">All Requests</div>
      <div class="section-controls">
        <div class="stale-selector">
          <span class="stale-label">⚠ Stale after:</span>
          <div id="weekBtns" style="display:flex;gap:4px;"></div>
        </div>
        <div class="filters" id="priorityFilters"></div>

    <div class="table-wrap">
      <div class="table-top">
        <input class="search-input" type="text" id="searchInput" placeholder="Search by title, ref, module…" oninput="renderTable()"/>
        <span class="result-count" id="resultCount"></span>
      </div>
      <div style="overflow-x:auto">
        <table>
          <thead>
            <tr>
              <th onclick="sortBy('refNo')">Ref ↕</th>
              <th onclick="sortBy('title')">Title ↕</th>
              <th onclick="sortBy('priority')">Priority ↕</th>
              <th onclick="sortBy('status')">Status ↕</th>
              <th onclick="sortBy('developerStatus')">Dev Status ↕</th>
              <th onclick="sortBy('date')">Date ↕</th>
              <th onclick="sortBy('developedBy')">Assigned To ↕</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>

  </div><!-- /dashboardContent -->
</main>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal" id="modal"></div>
</div>

<footer>ERP Development Tracker · VBEDU · Live data from Google Sheets</footer>

<script>
// ── CONFIG ────────────────────────────────────────────────────────────────
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/1pRpFxQRcjX0cPCh6SyRzEUj5NLW8BIXv7Cly9n_X_70/export?format=csv&gid=0";

// ── MATRIX DEFINITIONS ───────────────────────────────────────────────────
const MATRICES = {
  status:    { title:'Request Status',    rowField:'module',          colField:'status',          cols:[{k:'Open',l:'Open',p:'cp-open'},{k:'On Hold',l:'On Hold',p:'cp-onhold'},{k:'Closed',l:'Closed',p:'cp-closed'},{k:'Cancelled',l:'Cancelled',p:'cp-cancelled'}] },
  priority:  { title:'Priority',          rowField:'module',          colField:'priority',         cols:[{k:'Low',l:'Low',p:'cp-low'},{k:'Medium',l:'Medium',p:'cp-medium'},{k:'High',l:'High',p:'cp-high'},{k:'Critical',l:'Critical',p:'cp-critical'}] },
  stage:     { title:'Development Stage', rowField:'module',          colField:'devStage',         cols:[{k:'Development',l:'Development',p:'cp-devstage'},{k:'Testing',l:'Testing',p:'cp-testing'},{k:'Ready to deploy',l:'Ready to Deploy',p:'cp-rdeploy'},{k:'Deployed',l:'Deployed',p:'cp-deployed'}] },
  devStatus: { title:'Developer Status',  rowField:'module',          colField:'developerStatus',  cols:[{k:'Not Started',l:'Not Started',p:'cp-notstarted'},{k:'In Progress',l:'In Progress',p:'cp-inprogress'},{k:'Incomplete',l:'Incomplete',p:'cp-incomplete'},{k:'Completed',l:'Completed',p:'cp-completed'},{k:'Deferred',l:'Deferred',p:'cp-deferred'}] },
  developer: { title:'Developer Workload',rowField:'developedBy',     colField:'status',           cols:[{k:'Open',l:'Open',p:'cp-open'},{k:'On Hold',l:'On Hold',p:'cp-onhold'},{k:'Closed',l:'Closed',p:'cp-closed'},{k:'Cancelled',l:'Cancelled',p:'cp-cancelled'}] },
  month:     { title:'Month-wise Status', rowField:'_monthKey',       colField:'status',           cols:[{k:'Open',l:'Open',p:'cp-open'},{k:'On Hold',l:'On Hold',p:'cp-onhold'},{k:'Closed',l:'Closed',p:'cp-closed'},{k:'Cancelled',l:'Cancelled',p:'cp-cancelled'}] },
};

// ── STATE ─────────────────────────────────────────────────────────────────
let RAW_DATA       = [];
let activeMonth    = 'All';
let activeCell     = null;   // {rowField,rowVal,colField,colVal,label}
let activePriority = null;
let staleWeeks     = 2;
let sortKey        = 'sl';
let sortDir        = 1;

// ── THEME ─────────────────────────────────────────────────────────────────
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  document.getElementById('themeToggle').textContent = t === 'dark' ? '🌙' : '☀️';
  try { localStorage.setItem('erp-theme', t); } catch(e){}
}
function toggleTheme() {
  applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
}
(function() {
  try { const s = localStorage.getItem('erp-theme'); if (s) applyTheme(s); } catch(e){}
})();

// ── CSV PARSER ────────────────────────────────────────────────────────────
function parseLine(line) {
  const cols=[]; let cur='', inQ=false;
  for (let i=0;i<line.length;i++) {
    const ch=line[i];
    if (ch==='"') { if(inQ&&line[i+1]==='"'){cur+='"';i++;} else inQ=!inQ; }
    else if (ch===','&&!inQ) { cols.push(cur.trim()); cur=''; }
    else cur+=ch;
  }
  cols.push(cur.trim()); return cols;
}
function parseCSV(text) {
  const lines=text.trim().split(/\r?\n/);
  if (lines.length<2) return [];
  const headers=parseLine(lines[0]).map(h=>h.toLowerCase().replace(/\s+/g,' ').trim());
  function get(cols,...keys) {
    for (const k of keys) { const i=headers.indexOf(k.toLowerCase()); if(i!==-1&&cols[i]!==undefined) return (cols[i]||'').replace(/^"|"$/g,'').trim(); }
    return '';
  }
  return lines.slice(1).map((line,i)=>{
    if (!line.trim()) return null;
    const cols=parseLine(line);
    const dateStr=get(cols,'date','date raised','created at');
    return {
      sl:i+1, app:get(cols,'app')||'REQ',
      refNo:   get(cols,'ref no','ref','refno','reference')||('REQ-'+(i+1)),
      date:    dateStr,
      _monthKey: toMonthKey(dateStr),
      module:  get(cols,'module'),
      title:   get(cols,'title'),
      description: get(cols,'description','desc'),
      status:  get(cols,'status'),
      priority:get(cols,'priority'),
      devStage:get(cols,'development stage','dev stage','devstage','stage'),
      developerStatus:get(cols,'developer status','dev status','developerstatus'),
      submittedBy:get(cols,'submitted by','submittedby','raised by'),
      developedBy:get(cols,'developed by','developedby','assigned to','assignee')||'Unassigned',
      portal:  get(cols,'portal'),
    };
  }).filter(r=>r&&r.title);
}

// ── DATE HELPERS ─────────────────────────────────────────────────────────
function toMonthKey(dateStr) {
  if (!dateStr) return null;
  let d;
  if (/^\d{2}[-\/]\d{2}[-\/]\d{4}$/.test(dateStr)) {
    const p=dateStr.split(/[-\/]/); d=new Date(p[2]+'-'+p[1]+'-'+p[0]);
  } else { d=new Date(dateStr); }
  if (isNaN(d)) return null;
  return d.toLocaleDateString('en-GB',{month:'short',year:'numeric'});
}
function daysSince(dateStr) {
  if (!dateStr) return null;
  let d;
  if (/^\d{2}[-\/]\d{2}[-\/]\d{4}$/.test(dateStr)) {
    const p=dateStr.split(/[-\/]/); d=new Date(p[2]+'-'+p[1]+'-'+p[0]);
  } else { d=new Date(dateStr); }
  if (isNaN(d)) return null;
  return Math.floor((Date.now()-d.getTime())/(1000*60*60*24));
}
function isStale(r) {
  if (r.status!=='Open' || r.developerStatus!=='Not Started') return false;
  const days=daysSince(r.date);
  return days!==null && days>=(staleWeeks*7);
}

// ── FILTERED DATA ─────────────────────────────────────────────────────────
function getMonthFiltered() {
  if (activeMonth==='All') return RAW_DATA;
  return RAW_DATA.filter(r=>r._monthKey===activeMonth);
}
function getFiltered() {
  const q=(document.getElementById('searchInput').value||'').toLowerCase().trim();
  return getMonthFiltered().filter(r=>{
    if (activeCell) {
      if (r[activeCell.rowField]!==activeCell.rowVal) return false;
      if (r[activeCell.colField]!==activeCell.colVal) return false;
    }
    if (activePriority && r.priority!==activePriority) return false;
    if (q && !r.title.toLowerCase().includes(q) && !r.refNo.toLowerCase().includes(q) && !r.module.toLowerCase().includes(q)) return false;
    return true;
  }).sort((a,b)=>{
    if (sortKey==='sl') return (a.sl-b.sl)*sortDir;
    return (a[sortKey]||'').localeCompare(b[sortKey]||'')*sortDir;
  });
}

// ── STAT BAR ──────────────────────────────────────────────────────────────
function buildStatBar() {
  const d=getMonthFiltered();
  const total=d.length;
  const open=d.filter(r=>r.status==='Open').length;
  const highCrit=d.filter(r=>r.priority==='High'||r.priority==='Critical').length;
  const notStarted=d.filter(r=>r.developerStatus==='Not Started').length;
  const development=d.filter(r=>r.devStage==='Development').length;
  const ready=d.filter(r=>r.devStage==='Ready to deploy').length;
  document.getElementById('statBar').innerHTML=
    sc('sc-total',   'Total Requests', total,    'All development items')+
    sc('sc-open',    'Open',           open,     'Pending resolution')+
    sc('sc-highcrit','High + Critical', highCrit,'Needs immediate action')+
    sc('sc-notstart','Not Started',    notStarted,'Development pending')+
    sc('sc-dev',     'In Development', development,'Actively being built')+
    sc('sc-ready',   'Ready to Deploy',ready,    'Waiting to go live');
}
function sc(cls,label,val,desc) {
  return '<div class="stat-card '+cls+'"><div class="stat-label">'+label+'</div><div class="stat-value">'+val+'</div><div class="stat-desc">'+desc+'</div></div>';
}

// ── BUILD MATRIX ──────────────────────────────────────────────────────────
function buildMatrix(containerId, key) {
  const def=MATRICES[key];
  const data=getMonthFiltered();

  // get unique row values
  const rowVals=[...new Set(data.map(r=>r[def.rowField]).filter(Boolean))].sort();

  // tally
  const counts={}, colTotals={};
  let grand=0;
  def.cols.forEach(c=>{colTotals[c.k]=0;});
  rowVals.forEach(rv=>{
    counts[rv]={};
    def.cols.forEach(c=>{counts[rv][c.k]=0;});
  });
  data.forEach(r=>{
    const rv=r[def.rowField]; if(!rv) return;
    def.cols.forEach(c=>{
      if(r[def.colField]===c.k){counts[rv][c.k]++;colTotals[c.k]++;grand++;}
    });
  });
  const rowTotals={};
  rowVals.forEach(rv=>{rowTotals[rv]=def.cols.reduce((s,c)=>s+counts[rv][c.k],0);});

  function pill(n,p) {
    if(n===0) return '<span class="cp zero">—</span>';
    return '<span class="cp '+p+'">'+n+'</span>';
  }

  const thCols=def.cols.map(c=>'<th style="min-width:78px">'+c.l+'</th>').join('');

  const bodyRows=rowVals.map(rv=>{
    const cells=def.cols.map(c=>{
      const isAct=activeCell&&activeCell.rowField===def.rowField&&activeCell.rowVal===rv&&activeCell.colField===def.colField&&activeCell.colVal===c.k;
      return '<td class="dc"'+(isAct?' style="background:rgba(108,99,255,.1)"':'')+' onclick="setCellFilter(\''+def.rowField+'\',\''+rv.replace(/'/g,"\\'")  +'\',\''+def.colField+'\',\''+c.k.replace(/'/g,"\\'")+'\',\''+rv.replace(/'/g,"\\'")+' · '+c.l+'\')">'+pill(counts[rv][c.k],c.p)+'</td>';
    }).join('');
    return '<tr><td>'+rv+'</td><td>'+pill(rowTotals[rv],'cp-total')+'</td>'+cells+'</tr>';
  }).join('');

  const totalCells=def.cols.map(c=>'<td>'+pill(colTotals[c.k],c.p)+'</td>').join('');

  document.getElementById(containerId).innerHTML=
    '<div class="matrix-card-header">'+
      '<span class="matrix-card-title">'+def.title+'</span>'+
      '<span class="matrix-card-total">'+grand+' total</span>'+
    '</div>'+
    '<div class="matrix-table-wrap"><table class="matrix-table">'+
      '<thead><tr><th style="min-width:110px">'+(def.rowField==='_monthKey'?'Month':def.rowField==='developedBy'?'Developer':'Module')+'</th>'+
        '<th style="min-width:56px">Total</th>'+thCols+'</tr></thead>'+
      '<tbody>'+bodyRows+
        '<tr class="total-row"><td>Total</td><td>'+pill(grand,'cp-total')+'</td>'+totalCells+'</tr>'+
      '</tbody></table></div>';
}

function buildAllMatrices() {
  buildMatrix('mxStatus',    'status');
  buildMatrix('mxPriority',  'priority');
  buildMatrix('mxStage',     'stage');
  buildMatrix('mxDevStatus', 'devStatus');
  buildMatrix('mxDeveloper', 'developer');
  buildMatrix('mxMonth',     'month');
}

// ── MONTH BAR ─────────────────────────────────────────────────────────────
function buildMonthBar() {
  const months=['All'];
  const seen=new Set();
  RAW_DATA.forEach(r=>{ if(r._monthKey&&!seen.has(r._monthKey)){seen.add(r._monthKey);months.push(r._monthKey);} });
  document.getElementById('monthBtns').innerHTML=months.map(m=>
    '<button class="pill-btn '+(activeMonth===m?'active':'')+'" onclick="setMonth(\''+m+'\')">'+m+'</button>'
  ).join('');
}
function setMonth(m) {
  activeMonth=m; activeCell=null; activePriority=null;
  buildMonthBar(); buildStatBar(); buildAllMatrices(); buildPriorityFilters(); renderActiveFilters(); renderTable();
}

// ── WEEK SELECTOR ─────────────────────────────────────────────────────────
function buildWeekBtns() {
  document.getElementById('weekBtns').innerHTML=[1,2,3,4,5].map(w=>
    '<button class="week-btn '+(staleWeeks===w?'active':'')+'" onclick="setStaleWeeks('+w+')">'+w+'W</button>'
  ).join('');
}
function setStaleWeeks(w) { staleWeeks=w; buildWeekBtns(); renderTable(); }

// ── CELL FILTER ───────────────────────────────────────────────────────────
function setCellFilter(rowField, rowVal, colField, colVal, label) {
  if (activeCell&&activeCell.rowField===rowField&&activeCell.rowVal===rowVal&&activeCell.colField===colField&&activeCell.colVal===colVal) {
    activeCell=null;
  } else {
    activeCell={rowField,rowVal,colField,colVal,label};
  }
  buildAllMatrices(); renderActiveFilters(); renderTable();
}

// ── PRIORITY FILTER ───────────────────────────────────────────────────────
function buildPriorityFilters() {
  document.getElementById('priorityFilters').innerHTML=
    ['Critical','High','Medium','Low'].map(p=>
      '<button class="filter-btn '+(activePriority===p?'active':'')+'" onclick="filterPriority(\''+p+'\')">'+p+'</button>'
    ).join('');
}
function filterPriority(p) {
  activePriority=activePriority===p?null:p;
  buildPriorityFilters(); renderActiveFilters(); renderTable();
}

// ── ACTIVE FILTER CHIPS ───────────────────────────────────────────────────
window._clears=[];
function renderActiveFilters() {
  const chips=[];
  if (activeMonth!=='All') chips.push({l:activeMonth, fn:()=>setMonth('All')});
  if (activeCell)          chips.push({l:activeCell.label, fn:()=>{activeCell=null;buildAllMatrices();renderActiveFilters();renderTable();}});
  if (activePriority)      chips.push({l:'Priority: '+activePriority, fn:()=>{activePriority=null;buildPriorityFilters();renderActiveFilters();renderTable();}});
  window._clears=chips.map(c=>c.fn);
  const el=document.getElementById('activeFilters');
  if (!chips.length){el.innerHTML='';return;}
  el.innerHTML=chips.map((c,i)=>
    '<span class="filter-chip">'+c.l+'<button onclick="window._clears['+i+']()" title="Remove">×</button></span>'
  ).join('')+'<button class="clear-all-btn" onclick="clearAll()">Clear all</button>';
}
function clearAll() {
  activeMonth='All';activeCell=null;activePriority=null;
  buildMonthBar();buildStatBar();buildAllMatrices();buildPriorityFilters();renderActiveFilters();renderTable();
}

// ── TABLE ─────────────────────────────────────────────────────────────────
function sortBy(k) { if(sortKey===k)sortDir*=-1; else{sortKey=k;sortDir=1;} renderTable(); }

function getPriorityCls(p) {
  if(!p)return'';
  return{critical:'priority-critical',high:'priority-high',medium:'priority-medium',low:'priority-low'}[p.toLowerCase()]||'';
}
function getStatusCls(s) {
  if(!s)return'';
  return{'open':'status-open','on hold':'status-onhold','closed':'status-closed','cancelled':'status-cancelled'}[s.toLowerCase()]||'status-open';
}
function getDevCls(d) {
  if(!d)return'';
  return{'not started':'dev-notstarted','in progress':'dev-inprogress','incomplete':'dev-incomplete','completed':'dev-completed','deferred':'dev-deferred'}[d.toLowerCase()]||'dev-notstarted';
}

function renderTable() {
  const data=getFiltered();
  document.getElementById('resultCount').textContent=data.length+' of '+RAW_DATA.length;
  if (!data.length) {
    document.getElementById('tableBody').innerHTML=
      '<tr><td colspan="7"><div class="empty-state">'+
        '<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>'+
        '<div>No requests match your filters.</div></div></td></tr>';
    return;
  }
  document.getElementById('tableBody').innerHTML=data.map(r=>{
    const stale=isStale(r);
    const days=daysSince(r.date);
    const staleTag=stale?'<span class="stale-tag">⚠ '+(days>0?days+'d':'stale')+'</span>':'';
    return '<tr class="'+(stale?'stale-row':'')+'" onclick="openModal('+(r.sl-1)+')">'+
      '<td><span class="ref-badge">'+r.refNo+'</span></td>'+
      '<td class="title-cell"><div class="module-tag">'+r.module+'</div><span class="title-text">'+r.title+'</span>'+staleTag+'</td>'+
      '<td><span class="badge '+getPriorityCls(r.priority)+'">'+r.priority+'</span></td>'+
      '<td><span class="badge '+getStatusCls(r.status)+'">'+r.status+'</span></td>'+
      '<td><span class="badge '+getDevCls(r.developerStatus)+'">'+r.developerStatus+'</span></td>'+
      '<td class="date-cell">'+r.date+'</td>'+
      '<td class="assignee">'+r.developedBy+'</td>'+
    '</tr>';
  }).join('');
}

// ── MODAL ────────────────────────────────────────────────────────────────
function openModal(idx) {
  const r=RAW_DATA[idx];
  const stale=isStale(r);
  const days=daysSince(r.date);
  document.getElementById('modal').innerHTML=
    '<div class="modal-header">'+
      '<div>'+
        '<div class="modal-ref">'+r.refNo+' · '+r.module+'</div>'+
        '<div class="modal-title">'+r.title+(stale?'&nbsp;<span class="stale-tag">⚠ '+days+'d stale</span>':'')+'</div>'+
      '</div>'+
      '<button class="modal-close" onclick="document.getElementById(\'modalOverlay\').classList.remove(\'open\')">×</button>'+
    '</div>'+
    '<div class="modal-meta">'+
      '<span class="badge '+getPriorityCls(r.priority)+'">'+r.priority+' Priority</span>'+
      '<span class="badge '+getStatusCls(r.status)+'">'+r.status+'</span>'+
      '<span class="badge '+getDevCls(r.developerStatus)+'">'+r.developerStatus+'</span>'+
    '</div>'+
    '<div class="modal-desc">'+(r.description||'No description provided.')+'</div>'+
    '<div class="modal-fields">'+
      '<div class="field-item"><span class="field-label">Submitted By</span><span class="field-value">'+(r.submittedBy||'—')+'</span></div>'+
      '<div class="field-item"><span class="field-label">Developed By</span><span class="field-value">'+r.developedBy+'</span></div>'+
      '<div class="field-item"><span class="field-label">Date Raised</span><span class="field-value" style="font-family:monospace">'+(r.date||'—')+'</span></div>'+
      '<div class="field-item"><span class="field-label">Portal</span><span class="field-value">'+(r.portal||'—')+'</span></div>'+
      '<div class="field-item"><span class="field-label">Dev Stage</span><span class="field-value">'+(r.devStage||'—')+'</span></div>'+
      '<div class="field-item"><span class="field-label">App</span><span class="field-value">'+(r.app||'—')+'</span></div>'+
    '</div>';
  document.getElementById('modalOverlay').classList.add('open');
}
function closeModal(e) { if(e.target===document.getElementById('modalOverlay')) document.getElementById('modalOverlay').classList.remove('open'); }
document.addEventListener('keydown',e=>{ if(e.key==='Escape') document.getElementById('modalOverlay').classList.remove('open'); });

// ── LOAD DATA ────────────────────────────────────────────────────────────
async function loadData() {
  try {
    const res=await fetch(SHEET_CSV_URL);
    if (!res.ok) throw new Error('HTTP '+res.status);
    const text=await res.text();
    RAW_DATA=parseCSV(text);
    if (!RAW_DATA.length) throw new Error('No data rows found. Check sheet tab and column headers.');

    document.getElementById('lastUpdated').textContent=
      'Updated '+new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});

    document.getElementById('loadingState').style.display='none';
    document.getElementById('dashboardContent').style.display='block';

    buildMonthBar();
    buildStatBar();
    buildAllMatrices();
    buildPriorityFilters();
    buildWeekBtns();
    renderActiveFilters();
    renderTable();
  } catch(err) {
    document.getElementById('loadingState').innerHTML=
      '<div style="text-align:center;color:var(--high)">'+
        '<div style="font-size:32px;margin-bottom:10px">⚠️</div>'+
        '<div style="font-size:14px">Could not load data from Google Sheets.</div>'+
        '<div style="font-size:12px;color:var(--muted);margin-top:6px">'+err.message+'</div>'+
        '<div style="font-size:12px;color:var(--muted);margin-top:10px">File → Share → Publish to web → CSV → Publish</div>'+
        '<button onclick="loadData()" style="margin-top:16px;background:var(--accent);color:#fff;border:none;padding:8px 20px;border-radius:8px;cursor:pointer;font-size:13px;">Retry</button>'+
      '</div>';
    console.error('Sheet load error:',err);
  }
}
